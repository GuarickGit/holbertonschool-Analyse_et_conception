openapi: 3.0.3
info:
  title: MegaShop-B2B API
  version: 1.0.0
  description: API publique de MegaShop-B2B.
servers:
  - url: https://api.megashop-b2b.com/v1
paths:
  /payments/webhook:
    post:
      tags:
        - Paiements
      summary: Notification de paiement envoyée par la banque
      description: Webhook appelé par la banque partenaire pour notifier le succès ou l'échec d'une transaction.
      requestBody:
        required: true
        content:
          applications/json:
            schema:
              $ref: '#/components/schemas/WebhookPayload'
      responses:
        "204":
          description: Notification acceptée. Aucun contenu n'est renvoyé.
        "400":
          description: Payload invalide.
          content:
            applications/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    WebhookPayload:
      type: object
      required:
        - orderId
        - paymentStatus
        - transactionId
      properties:
        orderId:
          type: string
        paymentStatus:
          type: string
        transactionId:
          type: string
    ErrorResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
